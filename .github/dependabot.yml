# Keeps the actions used by our workflows up to date, so deprecations
# (e.g. a Node runtime being retired) arrive as a reviewable PR instead of
# failing builds. All updates come in one grouped PR per month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies]

  # Base images are pinned by digest; this keeps them patched.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deploy)
    labels: [dependencies]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deploy)
    labels: [dependencies]
  # Hashed pins for the hosted server image (deploy/requirements.txt).
  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      server-deps:
        patterns: ["*"]
    commit-message:
      prefix: chore(deploy)
    labels: [dependencies]
