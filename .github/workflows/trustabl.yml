name: Trustabl Agent Scanner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal top-level permissions; write grants are scoped to the scan job only.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trustabl-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisory scan: findings are still reported (annotations, SARIF, PR
      # comment) but never turn the check red. continue-on-error must sit on
      # the step: at job level the "scan" check run still shows as failed.
      # The scanner exits non-zero on any medium+ finding, and the action has
      # no input that disables that.
      - uses: trustabl/trustabl-action@d97575c864814bf4965fa2c72c044224d372723a # v0.4.3
        continue-on-error: true
        with:
          version: v0.1.6
          upload-sarif: "false"
      # Some findings are about the whole repository and carry no file location.
      # Code scanning rejects those ("expected at least one location") and marks
      # the check as errored, so they are dropped from the upload only; they are
      # still in the PR comment and the trustabl-scan-results artifact.
      - name: Drop findings without a file location
        if: hashFiles('trustabl.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json
          with open("trustabl.sarif", encoding="utf-8") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              results = run.get("results", [])
              run["results"] = [r for r in results if r.get("locations")]
              print(f"uploading {len(run['results'])} of {len(results)} findings")
          with open("trustabl.sarif", "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          EOF
      # Fork PRs get a read-only token and cannot upload; that must not fail the job.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: hashFiles('trustabl.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trustabl.sarif
          category: trustabl
