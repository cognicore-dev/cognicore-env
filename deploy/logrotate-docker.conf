# Delete container logs after 14 days.
#
# Caddy's access log records a visitor's IP address, and the app logs errors,
# so these are personal data. The privacy policy says they are deleted after
# 14 days (PRIVACY.md, "How long we keep it"); this file is what makes that
# true. Installed at /etc/logrotate.d/cognicore-docker by setup-host.sh, and
# run by the distribution's daily logrotate timer.
#
# copytruncate, because Docker holds the log file open and would keep writing
# to a renamed file. maxage repeats the limit that `rotate` already sets, so a
# host whose logrotate timer stops for a while still drops old logs when it
# next runs.
/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 13
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
